name: Godot CI

on:
  push:

jobs:
  godot-build:
    runs-on: docker

    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Check Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Verify project files
        run: |
          test -f project.godot
          test -f export_presets.cfg
          echo "Project files verified."

      - name: Build Windows game
        run: |
          mkdir -p builds
          godot --headless --path . --export-release "Windows Desktop" builds/EcoShield.exe

      - name: Verify Windows build
        run: |
          test -f builds/EcoShield.exe
          ls -lh builds/EcoShield.exe
          echo "Windows build created successfully."
      
      - name: Upload Windows build
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: EcoShield-Windows
          path: builds/