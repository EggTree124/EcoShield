name: Godot CI

on:
  push:

jobs:
  godot-check:
    runs-on: docker

    container:
      image: barichello/godot-ci:4.7.1
      network: forgejo

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Check Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Verify project files
        run: |
          test -f project.godot
          echo "project.godot exists"
          echo "Godot CI check passed!"